name: RnD Weather Validation

on:

  workflow_dispatch:

  schedule:

    # 7:00 AM IST
    - cron: "30 1 * * *"

    # 3:00 PM IST
    - cron: "30 9 * * *"

jobs:

  run-rnd-weather-validation:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Run Pipeline
        env:

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}

          WEATHER_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}

          RND_WATI_API_URL: ${{ secrets.RND_WATI_API_URL }}

          RND_WATI_API_KEY: ${{ secrets.RND_WATI_API_KEY }}

          RND_WATI_TEMPLATE_NAME: ${{ secrets.RND_WATI_TEMPLATE_NAME }}

        run: |

          python -m rnd_weather_validation.main
